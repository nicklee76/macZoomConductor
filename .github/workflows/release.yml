name: Release Build, Notarization & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Notarize & Package macZoomConductor
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Developer ID Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -n "${BUILD_CERTIFICATE_BASE64:-}" ]]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          else
            echo "Signing certificate not provided; building in ad-hoc/test mode."
          fi

      - name: Run Host App & Extension Test Suites
        run: |
          swift test --package-path HostApp
          ./scripts/test_extensions.sh

      - name: Build Universal Host App & Safari Extension
        env:
          ZC_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY || '-' }}
          ZC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '7VKT4UT7RU' }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ./scripts/build_and_install.sh --version "$VERSION" --build-only --sign-identity "${ZC_SIGN_IDENTITY}"

      - name: Package Chrome & Firefox Extensions
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist/packages
          
          # Chrome extension zip
          (cd dist/extensions/chrome && zip -r "../../packages/browsernexus-chrome-v${VERSION}.zip" .)
          
          # Firefox extension zip
          (cd dist/extensions/firefox && zip -r "../../packages/browsernexus-firefox-v${VERSION}.zip" .)

      - name: Notarize App Bundle & Build DMG
        env:
          ZC_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY || '-' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          if [[ -n "${APPLE_API_KEY_BASE64:-}" ]]; then
            API_KEY_DIR="$RUNNER_TEMP/private_keys"
            mkdir -p "$API_KEY_DIR"
            echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$API_KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
            
            xcrun notarytool store-credentials bnexus \
              --key "$API_KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
              
            ./scripts/create_dmg.sh \
              --app "dist/macZoomConductor.app" \
              --output "dist/packages/macZoomConductor-${VERSION}.dmg" \
              --sign-identity "${ZC_SIGN_IDENTITY}" \
              --notarize \
              --keychain-profile "bnexus"
          else
            ./scripts/create_dmg.sh \
              --app "dist/macZoomConductor.app" \
              --output "dist/packages/macZoomConductor-${VERSION}.dmg"
          fi

      - name: Generate SHA-256 Checksums
        run: |
          cd dist/packages
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/packages/macZoomConductor-${{ steps.get_version.outputs.VERSION }}.dmg
            dist/packages/browsernexus-chrome-v${{ steps.get_version.outputs.VERSION }}.zip
            dist/packages/browsernexus-firefox-v${{ steps.get_version.outputs.VERSION }}.zip
            dist/packages/SHA256SUMS.txt
            EULA.md
          name: "browserNexus v${{ steps.get_version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
